services:
  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dashboard
    volumes:
      # Postgres 18+ keeps data in a version-specific subdirectory of this path
      - pgdata18:/var/lib/postgresql

volumes:
  pgdata18:
